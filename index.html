<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ed">
  <title>猜词现场 · FiresChain Tools</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="rounds.js"></script>
  <script defer src="lookup.js"></script>
  <script defer src="screen.js"></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="signal" viewBox="0 0 24 24"><path d="M4 10v4m4-7v10m4-14v18m4-15v12m4-9v6"/></symbol>
    <symbol id="history" viewBox="0 0 24 24"><path d="M3.5 10a8.5 8.5 0 1 1 1.1 6.8M3 5.5v5h5M12 7v5l3 2"/></symbol>
    <symbol id="book" viewBox="0 0 24 24"><path d="M12 6.3C9.8 4.6 6 4.1 3 5v14c3-.9 6.8-.4 9 1.3 2.2-1.7 6-2.2 9-1.3V5c-3-.9-6.8-.4-9 1.3Zm0 0v14"/></symbol>
    <symbol id="expand" viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></symbol>
    <symbol id="play" viewBox="0 0 24 24"><path d="m8 4 12 8-12 8z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="tune" viewBox="0 0 24 24"><path d="M3 7h7m4 0h7M3 17h11m4 0h3"/><circle cx="12" cy="7" r="2"/><circle cx="16" cy="17" r="2"/></symbol>
  </defs></svg>
  <header class="mast">
    <div class="mast-inner">
      <div class="branding"><span class="logo" aria-hidden="true"><svg><use href="#signal"/></svg></span><h1>猜词现场</h1></div>
      <button class="screen" id="fullscreen" hidden><svg aria-hidden="true"><use href="#expand"/></svg><span>全屏</span></button>
    </div>
  </header>
  <main class="desk">
    <section class="center" aria-label="猜词主舞台">
      <div class="stage">
        <div class="stage-top"><span id="round-label">第 1 轮</span><span class="status"><i></i><span id="round-state" role="status">待开始</span></span></div>
        <div class="prompt"><span class="prompt-label">本轮关键词</span><strong id="word">囚牛</strong></div>
        <div class="timing"><div id="clock-caption">倒计时</div><span id="clock" role="timer" aria-live="off">01:00.00</span></div>
        <progress id="progress" max="1" value="1" aria-label="剩余时间比例"></progress>
      </div>
      <section class="control panel">
        <div class="section-heading"><svg aria-hidden="true"><use href="#tune"/></svg><h2>回合控制</h2></div>
        <form id="setup">
          <label for="keyword">关键词<input id="keyword" value="囚牛" maxlength="40" required autocomplete="off"></label>
          <label for="duration">限时<span class="seconds"><input id="duration" type="number" min="1" max="3600" step="1" value="60" required><span>秒</span></span></label>
          <button class="primary" id="start" type="submit"><svg aria-hidden="true"><use href="#play"/></svg>开始本轮</button>
        </form>
        <div id="play-actions" hidden><button class="primary" id="won" type="button">猜中了</button><button id="failed" type="button">未猜出</button></div>
      </section>
    </section>
    <aside class="history panel" aria-labelledby="history-title">
      <div class="section-heading"><svg aria-hidden="true"><use href="#history"/></svg><h2 id="history-title">历史战绩</h2><span class="count" id="history-count">0</span></div>
      <div class="stats"><div><strong id="history-wins">0</strong><span>猜中</span></div><div><strong id="history-losses">0</strong><span>未猜出</span></div></div>
      <p id="history-empty" class="empty">还没有回合记录</p><ol id="history-list"></ol>
    </aside>
    <aside class="lookup panel" aria-labelledby="lookup-title">
      <div class="section-heading"><svg aria-hidden="true"><use href="#book"/></svg><h2 id="lookup-title">查词手册</h2></div>
      <form id="lookup-form" role="search" action="https://www.baike.com/search" method="get" target="_blank" rel="noopener noreferrer">
        <input type="search" id="query" name="keyword" aria-label="在抖音百科查找词条" maxlength="100" placeholder="输入要查的词" value="囚牛" required>
        <button type="submit" aria-label="搜索抖音百科（新标签页）" title="搜索抖音百科"><svg aria-hidden="true"><use href="#search"/></svg></button>
      </form>
      <p class="lookup-note">搜索后在新标签页打开抖音百科。</p>
      <article id="entry">
        <h3>囚牛</h3>
        <p>中国民间传说中，龙生九子之一。</p>
        <dl><dt>读音</dt><dd>qiú niú</dd><dt>喜好</dt><dd>相传爱好音乐</dd><dt>传统形象</dt><dd>明代李东阳将胡琴琴头的兽形雕刻与囚牛联系起来</dd></dl>
        <footer>本地编写 · 参考 <a href="https://www.shidianguji.com/book/HY1130/chapter/1kvmfclsw6ujm" target="_blank" rel="noopener noreferrer">李东阳《记龙生九子》</a></footer>
      </article>
    </aside>
  </main>
</body>
</html>
