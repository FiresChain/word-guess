<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ed">
  <title>猜词现场 · FiresChain Tools</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="local-dictionary.js"></script>
  <script defer src="lookup.js"></script>
  <script defer src="rounds.js"></script>
  <script defer src="screen.js"></script>
  <script defer src="dictionary-ui.js"></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="signal" viewBox="0 0 24 24"><path d="M4 10v4m4-7v10m4-14v18m4-15v12m4-9v6"/></symbol>
    <symbol id="history" viewBox="0 0 24 24"><path d="M3.5 10a8.5 8.5 0 1 1 1.1 6.8M3 5.5v5h5M12 7v5l3 2"/></symbol>
    <symbol id="book" viewBox="0 0 24 24"><path d="M12 6.3C9.8 4.6 6 4.1 3 5v14c3-.9 6.8-.4 9 1.3 2.2-1.7 6-2.2 9-1.3V5c-3-.9-6.8-.4-9 1.3Zm0 0v14"/></symbol>
    <symbol id="expand" viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></symbol>
    <symbol id="gear" viewBox="0 0 24 24"><path d="m9 4 .7-2h4.6l.7 2 1.5.9 2.2-.4 2.3 4-1.4 1.6v1.8l1.4 1.6-2.3 4-2.2-.4-1.5.9-.7 2H9.7l-.7-2-1.5-.9-2.2.4-2.3-4 1.4-1.6v-1.8L3 8.5l2.3-4 2.2.4Z" transform="translate(0 1)"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="pencil" viewBox="0 0 24 24"><path d="m4 16-1 5 5-1L20 8l-4-4Zm10-10 4 4"/></symbol>
  </defs></svg>
  <header class="mast">
    <div class="mast-inner">
      <div class="branding"><span class="logo" aria-hidden="true"><svg><use href="#signal"/></svg></span><h1>猜词现场</h1></div>
      <div class="mast-actions">
        <button type="button" id="settings" class="screen" aria-haspopup="dialog"><svg aria-hidden="true"><use href="#gear"/></svg><span>设置</span></button>
        <button class="screen" id="fullscreen" hidden><svg aria-hidden="true"><use href="#expand"/></svg><span>全屏</span></button>
      </div>
    </div>
  </header>
  <main class="desk">
    <section class="center" aria-label="猜词主舞台">
      <div class="stage">
        <span id="round-state" role="status"></span>
        <div class="prompt"><button type="button" id="edit-word" title="编辑关键词" aria-haspopup="dialog" aria-labelledby="word edit-label"><strong id="word">囚牛</strong><svg aria-hidden="true"><use href="#pencil"/></svg><span id="edit-label" class="sr-only">编辑关键词</span></button></div>
        <div class="timing">
          <button type="button" id="toggle-clock" aria-label="开始计时" aria-keyshortcuts="Space">
            <span id="clock" role="timer" aria-live="off">100 秒</span>
          </button>
        </div>
        <progress id="progress" max="1" value="1" aria-label="剩余时间比例"></progress>
      </div>
    </section>
    <aside class="history panel" aria-labelledby="history-title">
      <div class="section-heading"><svg aria-hidden="true"><use href="#history"/></svg><h2 id="history-title">历史战绩</h2><span class="count" id="history-count">0</span></div>
      <p id="history-empty" class="empty">还没有回合记录</p><ol id="history-list"></ol>
    </aside>
    <aside class="lookup panel" aria-labelledby="lookup-title">
      <h2 id="lookup-title"><button id="lookup-handbook" type="button" class="section-heading" aria-expanded="true" aria-controls="lookup-body"><svg aria-hidden="true"><use href="#book"/></svg>查词手册</button></h2>
      <div class="lookup-actions">
        <button id="lookup-missing" type="button" title="将当前关键词加入本地词库">找不到</button>
        <span id="lookup-recorded" role="status"></span>
      </div>
      <div id="lookup-body">
        <p id="lookup-status" role="status"></p>
        <div id="lookup-switcher" hidden>
          <div id="switcher-label">切换词条</div>
          <div id="results" role="group" aria-labelledby="switcher-label"></div>
        </div>
        <button id="lookup-online" type="button" hidden>查找更多 Wikidata 词条</button>
        <article id="entry" aria-labelledby="entry-title" hidden></article>
      </div>
    </aside>
  </main>
  <dialog id="keyword-dialog" aria-labelledby="keyword-title">
    <form id="keyword-form">
      <h2 id="keyword-title"><label for="keyword">编辑关键词</label></h2>
      <input id="keyword" type="text" value="囚牛" maxlength="40" required autocomplete="off" autofocus>
      <div class="dialog-actions"><button id="cancel-keyword" type="button">取消</button><button class="primary" type="submit">确认</button></div>
    </form>
  </dialog>
  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <header class="settings-header">
      <h2 id="settings-title">设置</h2>
      <button id="cancel-settings" type="button">关闭</button>
    </header>
    <div class="settings-layout">
      <div class="settings-nav" role="tablist" aria-label="设置分类" aria-orientation="vertical">
        <button type="button" id="open-timer" role="tab" aria-controls="timer-panel" aria-selected="true">倒计时设置</button>
        <button type="button" id="open-dictionary" role="tab" aria-controls="dictionary-panel" aria-selected="false" tabindex="-1">本地词库</button>
      </div>
      <section id="timer-panel" class="settings-page" role="tabpanel" aria-labelledby="open-timer">
        <h3>倒计时设置</h3>
        <form id="settings-form">
          <label for="duration">每轮限时（秒）</label>
          <input id="duration" type="number" min="1" max="3600" step="1" value="100" required>
          <div class="timer-actions"><button class="primary" type="submit">保存</button><span id="duration-status" role="status"></span></div>
        </form>
      </section>
      <section id="dictionary-panel" class="settings-page" role="tabpanel" aria-labelledby="open-dictionary" hidden>
        <h3>本地词库</h3>
        <p class="dictionary-note">词条保存在当前浏览器，查词时优先显示本地词条。</p>
        <div class="dictionary-workspace">
          <section class="dictionary-entries" aria-labelledby="dictionary-list-title">
            <div class="dictionary-list-header">
              <h3 id="dictionary-list-title">已保存词条</h3>
              <button id="dictionary-new" type="button">新增</button>
            </div>
            <label class="dictionary-filter"><input id="dictionary-undescribed" type="checkbox">仅看无描述</label>
            <p id="dictionary-empty" class="dictionary-note">还没有本地词条</p>
            <ul id="dictionary-list"></ul>
          </section>
          <form id="dictionary-form" aria-labelledby="dictionary-editor-title">
            <h3 id="dictionary-editor-title">新增词条</h3>
            <label for="dictionary-keyword">关键词</label>
            <input id="dictionary-keyword" type="text" maxlength="40" autocomplete="off" required>
            <label for="dictionary-description">描述</label>
            <textarea id="dictionary-description" rows="5"></textarea>
            <div id="dictionary-edit-actions" class="dictionary-edit-actions">
              <button id="dictionary-delete" class="dictionary-danger" type="button" hidden>删除词条</button>
              <button class="primary" type="submit">保存词条</button>
            </div>
            <div id="dictionary-delete-confirmation" hidden>
              <p id="dictionary-delete-question"></p>
              <div class="dictionary-edit-actions">
                <button id="dictionary-cancel-delete" type="button" aria-describedby="dictionary-delete-question">取消</button>
                <button id="dictionary-confirm-delete" class="dictionary-danger" type="button" aria-describedby="dictionary-delete-question">确认删除</button>
              </div>
            </div>
          </form>
        </div>
        <p id="dictionary-status" role="status"></p>
        <footer class="dictionary-transfer">
          <div class="dictionary-transfer-actions">
            <button id="dictionary-import" type="button">导入 JSON</button>
            <input id="dictionary-file" type="file" accept=".json,application/json" hidden>
            <button id="dictionary-export" type="button">导出 JSON</button>
          </div>
          <p class="dictionary-note">导入会添加新词条，并覆盖同名词条。</p>
          <details class="dictionary-note">
            <summary>导入格式</summary>
            <pre><code>[{"keyword":"囚牛","description":"龙生九子之一，爱好音乐。"}]</code></pre>
          </details>
        </footer>
      </section>
    </div>
  </dialog>
</body>
</html>
